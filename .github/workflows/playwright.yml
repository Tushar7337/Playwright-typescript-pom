name: Playwright tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        run: npm test
        env:
          CI: 'true'

      - name: Zip Playwright report
        if: always() && hashFiles('playwright-report/index.html') != ''
        run: zip -qr playwright-report.zip playwright-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Email Playwright report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('playwright-report/index.html') != ''
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: tusharshingde@gmail.com
          from: ${{ secrets.GMAIL_USERNAME }}
          subject: 'Playwright report - ${{ github.repository }} #${{ github.run_number }}'
          body: |
            Playwright tests finished with outcome: ${{ steps.tests.outcome }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            The HTML report is attached as a ZIP file.
          attachments: playwright-report.zip
